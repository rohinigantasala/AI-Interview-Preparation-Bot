{% extends "base.html" %}
{% block title %}Login — AI Interview Preparation Bot{% endblock %}
{% block content %}
<section class="section container auth-wrap">
  <div class="card auth-card">
    <h1>Welcome Back</h1>
    <p>Sign in to access your personalized interview dashboard and history.</p>
    <form method="post" class="stack">
      <label>Email Address
        <input type="email" name="email" value="{{ email or '' }}" required />
      </label>
      <label>Password
        <input type="password" name="password" required />
      </label>
      <button type="submit" class="btn btn-primary">Sign In</button>
    </form>
    <p class="muted">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
  </div>
</section>
{% endblock %}
