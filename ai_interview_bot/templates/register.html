{% extends "base.html" %}
{% block title %}Create Account — AI Interview Preparation Bot{% endblock %}
{% block content %}
<section class="section container auth-wrap">
  <div class="card auth-card">
    <h1>Create Your Account</h1>
    <p>Start practising one-on-one AI voice and text interviews.</p>
    <form method="post" class="stack">
      <label>Full Name
        <input type="text" name="full_name" value="{{ full_name or '' }}" required />
      </label>
      <label>Email Address
        <input type="email" name="email" value="{{ email or '' }}" required />
      </label>
      <label>Password (min. 8 characters)
        <input type="password" name="password" minlength="8" required />
      </label>
      <label>Confirm Password
        <input type="password" name="confirm_password" minlength="8" required />
      </label>
      <button type="submit" class="btn btn-primary">Create Account</button>
    </form>
    <p class="muted">Already have an account? <a href="{{ url_for('login') }}">Sign in</a></p>
  </div>
</section>
{% endblock %}
